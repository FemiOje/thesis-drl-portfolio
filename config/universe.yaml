excluded_sectors:
  - name: Communication Services
    reason: >
      Driver duplication. Its mega-caps (GOOGL, META) are advertising-funded growth
      businesses duplicating Information Technology's factor; its telecoms (VZ, T)
      duplicate Utilities' rate sensitivity. Adds a sector without adding a driver.
  - name: Materials
    reason: Driver duplication — largely cyclical, already covered by Industrials.
  - name: Real Estate
    reason: Driver duplication — rate-sensitive, already covered by Utilities.

# ---------------------------------------------------------------------------
# Mechanical extensions of the rule. Both are pre-registered so that the M and
# basket sweeps (plan §4, F15/F16) involve no discretion whatsoever.
# ---------------------------------------------------------------------------

# base.yaml:sweeps.n_assets = [4, 8, 16]
scale_rule:
  8: one constituent per sector — the sector's rank-1 name. THE HEADLINE UNIVERSE.
  16: two constituents per sector — the sector's rank-1 and rank-2 names.
  4: >
    Rank-1 name from the four sectors spanning the design's two orthogonal axes:
    Information Technology (growth / long duration), Financials (rate-sensitive
    positive), Utilities (rate-sensitive negative) and Energy (commodity / inflation).
    Chosen on driver-coverage grounds and fixed in advance, never from realised returns.
  4_sectors: [Information Technology, Financials, Utilities, Energy]

# base.yaml:sweeps.basket_rank = [1, 2, 3] — the F16 alternative baskets, which
# separate "these eight names" from "eight names". Basket k takes the k-th largest
# constituent in each sector. Basket 1 IS the headline universe.
basket_rule:
  1: rank-1 constituent per sector (headline)
  2: rank-2 constituent per sector
  3: rank-3 constituent per sector

# Pre-registered before any run. Recorded here so the commit history proves it was
# fixed in advance rather than chosen after seeing results.
# `result` and `resolved` below are written by scripts/01_build_data.py.
correlation_gate:
  threshold: 0.7
  metric: pairwise correlation of simple daily returns
  measured_on: train
  action: substitute the next-largest constituent in the affected sector, then re-check
  max_rounds: 3
  applies_to:
  - one_per_sector
  tie_break: replace the constituent of the later-declared sector
