# Asset universe: the RULE, not a hand-picked list.
# See docs/IMPLEMENTATION_PLAN.md §0.
#
# Sectors below are pre-specified on ECONOMIC grounds. They are never chosen from
# realised correlations, which would be data snooping on the study window. Within
# each sector the constituent is then determined mechanically, leaving no discretion.

rule:
  as_of: 2021-08-25         # window start; market caps below were measured 2021-09-01
  criterion: largest S&P 500 constituent by market capitalisation within the sector
  exclusions:
    - diversified holding companies   # e.g. BRK.B — itself a portfolio, confounds the study
  requires: complete daily price history across data.start..data.end
  taxonomy_note: >
    GICS as of 2021 has ELEVEN sectors. Real Estate separated from Financials in 2016
    and Communication Services was created in 2018, so GOOGL/META sit in Communication
    Services, not Information Technology. Note also that V and MA were classified under
    Information Technology (Data Processing & Outsourced Services) until the March 2023
    GICS revision moved them to Financials; the 2021 classification is the one that
    applies at the as_of date and is the one used here.

# ---------------------------------------------------------------------------
# Market capitalisations at the as_of date.
#
# PROVENANCE. These are pre-registered CONSTANTS, not values computed at run time.
# That is a deliberate choice, because neither empirical route is sound:
#
#   1. Historical shares outstanding (yfinance `get_shares_full`) requires Yahoo's
#      fundamentals-timeseries endpoint, which is not reachable from this machine
#      (see MANIFEST.json:access_notes).
#   2. Computing cap = close x shares from the downloaded price series is WRONG in
#      principle: Yahoo's close is retroactively split-adjusted, so AMZN's
#      2021-09-01 close is returned as ~$174 (post the 20:1 split of June 2022)
#      while contemporaneous shares outstanding were ~507M. Mixing an adjusted
#      price with a historical share count produces a nonsense capitalisation.
#
# So the figures are recorded here with their inputs, fixed before any run, and the
# selection rule is applied mechanically to them by src/universe.py. `raw_close` is
# the UNADJUSTED close on 2021-09-01 (as printed at the time) and `shares` is the
# diluted/basic shares outstanding from the most recent quarterly filing on or before
# that date. market_cap_usd_bn = raw_close x shares.
#
# The two rankings tight enough that a sourcing error could flip them are flagged
# `close_call: true`. Verify those two against a citable source before Chapter 3 is
# written; the others clear by wide margins.
# ---------------------------------------------------------------------------

sectors:
  - name: Information Technology
    driver: long-duration growth
    candidates:
